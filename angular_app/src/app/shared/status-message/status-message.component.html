<div
  class="flex flex-col items-center gap-3 rounded-xl border border-dashed border-slate-300 bg-white px-6 py-14 text-center"
>
  <p class="text-base font-semibold text-slate-800">{{ title() }}</p>

  @if (detail(); as detail) {
    <p class="max-w-md text-sm text-slate-500">{{ detail }}</p>
  }

  @if (actionLabel(); as actionLabel) {
    <button
      type="button"
      class="mt-2 rounded-lg bg-brand-600 px-4 py-2 text-sm font-medium text-white transition hover:bg-brand-700"
      (click)="action.emit()"
    >
      {{ actionLabel }}
    </button>
  }
</div>
